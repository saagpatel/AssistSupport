name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emit-sboms:
    name: Generate and attach CycloneDX SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (pinned 2026-10-05)
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-cyclonedx

      - name: Generate npm SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cdxgen@latest \
            --spec-version 1.5 \
            --type js \
            --output sbom-npm.cdx.json \
            .

      - name: Generate pip SBOM (CycloneDX)
        working-directory: search-api
        run: |
          python -m pip install --upgrade pip
          python -m pip install cyclonedx-bom==4.1.4
          cyclonedx-py requirements \
            --output-format JSON \
            --output-file ../sbom-pip.cdx.json \
            requirements.txt

      - name: Generate cargo SBOM (CycloneDX)
        working-directory: src-tauri
        run: |
          cargo cyclonedx --format json --override-filename ../sbom-cargo

      - name: List generated SBOMs
        run: ls -la sbom-*.cdx.json sbom-cargo.cdx.json 2>/dev/null || ls -la sbom-*.json

      - name: Upload SBOMs as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.event.release.tag_name || github.run_id }}
          path: |
            sbom-npm.cdx.json
            sbom-pip.cdx.json
            sbom-cargo.cdx.json
          if-no-files-found: error
          retention-days: 365

      - name: Attach SBOMs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            sbom-npm.cdx.json \
            sbom-pip.cdx.json \
            sbom-cargo.cdx.json \
            --clobber
